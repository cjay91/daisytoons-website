name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: daisytoons
          POSTGRES_PASSWORD: daisytoons
          POSTGRES_DB: daisytoons
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daisytoons"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://daisytoons:daisytoons@localhost:5432/daisytoons_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, console]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: curl --fail --silent http://localhost:8000/health
      - name: Migrations ran on start
        run: docker compose exec -T db psql -U daisytoons -tAc "select count(*) from alembic_version" | grep -q 1
      - name: Sample products import and their images are served
        run: |
          docker compose exec -T api python -m app.cli import-products \
            /templates/products-sample.csv --images /templates/sample-images
          url=$(curl --fail --silent "http://localhost:8000/products?occasion=birthday" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)[0]["images"][0]["url"])')
          curl --fail --silent --output /dev/null "$url"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
