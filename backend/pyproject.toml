[project]
name = "daisytoons-backend"
version = "0.1.0"
description = "API and business logic for the Daisytoons gift shop"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pyjwt>=2.15",
    "pwdlib[argon2]>=0.3",
    "email-validator>=2.3",
    "boto3>=1.43",
    "python-multipart>=0.0.32",
    "redis>=5",
    "pyotp>=2.9",
    "sentry-sdk[fastapi]>=2",
    "anthropic>=1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations can hold long SQL strings.
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
