[project]
name = "daisytoons-backend"
version = "0.1.0"
description = "API and business logic for the Daisytoons gift shop"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.16",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
